[package]
name = "dcs-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Infrastructure behind traits: imaging / source / persistence + dumb
# export executor. Depends DOWN on dcs-domain only. (§9, §10)
[dependencies]
dcs-domain.workspace = true

serde.workspace = true
serde_json.workspace = true
time.workspace = true
thiserror.workspace = true

# imaging
image.workspace = true
turbojpeg.workspace = true
kamadak-exif.workspace = true
rayon.workspace = true

# source: scan + content fingerprint
walkdir.workspace = true
blake3.workspace = true

# disposable cache store
rusqlite.workspace = true

# contact-sheet PDF renderer
printpdf.workspace = true

# threading: one-directional channels
crossbeam-channel.workspace = true

# AI search: local CLIP-style embedding inference via ONNX Runtime. The SigLIP
# model (pre-exported ONNX) is baked into the binary by build.rs (no runtime
# download). Hidden behind the `Embedder`/`EmbeddingCache` traits; nothing here
# leaks above dcs-io. GPU acceleration comes from the `webgpu` execution
# provider (workspace feature) — every vendor, every OS, no user installs.
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[features]
default = ["ai-search"]
# Local AI semantic search. Off: `SiglipEmbedder::new()` reports "not included
# in this build" and no model is downloaded or embedded — used for targets ort
# ships no prebuilt ONNX Runtime for (macOS x86_64).
ai-search = ["dep:ort", "dep:tokenizers"]

# When `ai-search` is on, build.rs fetches the pinned ONNX model files, verifies
# their SHA-256, and stages them in OUT_DIR for `include_bytes!`. Set
# DCS_MODEL_DIR to build offline.
[build-dependencies]
ureq.workspace = true
sha2.workspace = true
