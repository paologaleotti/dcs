[package]
name = "dcs-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "dcs — a fast, keyboard-first digital contact sheet for scanning, culling, and tagging photos."

# Distributable packaging (cargo-packager). One tool, all platforms: .app/.dmg
# (macOS), NSIS installer (Windows), AppImage + .deb (Linux). Formats are chosen
# per-OS on the CI runner via `--formats`; icons/desktop entries are generated
# from the fields below. macOS signing + notarization are driven entirely by
# APPLE_* env vars in CI (no config here), and are skipped when those are unset.
[package.metadata.packager]
product-name = "dcs"
identifier = "io.github.paologaleotti.dcs"
category = "Photography"
authors = ["Paolo Galeotti <paologaleotti2002@gmail.com>"]
# Paths resolve relative to this manifest. cargo-packager selects per platform:
# .icns (macOS), .ico (Windows), .png (Linux).
icons = ["../../assets/icon.icns", "../../assets/icon.ico", "../../assets/icon.png"]
# The binary embeds the Apache-2.0 SigLIP weights, so its attribution travels
# with every package. target/webgpu-dist holds the ONNX Runtime WebGPU shared
# library (staged there by release CI; empty in no-AI builds) — the binary loads
# it at startup via the rpaths set in build.rs.
resources = [
    "../../THIRD_PARTY_NOTICES.md",
    { src = "../../target/webgpu-dist", target = "." },
]

# 13.4 is inherited from ort's prebuilt ONNX Runtime libraries (their build
# floor). Release CI lowers this to 11.0 for the Intel no-AI build, which links
# no ONNX Runtime. CI also appends a `frameworks` entry here for the AI build
# (the Dawn dylib must land in Contents/Frameworks; it can't live in the
# manifest permanently because cargo-packager hard-fails on the path missing).
[package.metadata.packager.macos]
minimum-system-version = "13.4"

# Runtime libraries egui/winit/rfd link against on Linux. AppImage bundles them;
# the .deb declares them so apt resolves them on install. libstdc++6 >= 13.2:
# ort's libwebgpu_dawn.so requires GLIBCXX_3.4.32 at load time.
[package.metadata.packager.deb]
depends = ["libgtk-3-0", "libxkbcommon0", "libwayland-client0", "libstdc++6 (>= 13.2)"]

# egui binary: view modes (grid, gallery; board later) + ephemeral UI
# state. Top of the tree. Depends DOWN on dcs-app + dcs-domain. (§9)
[[bin]]
name = "dcs"
path = "src/main.rs"

[features]
default = ["ai-search"]
# Local AI semantic search (on by default). Build with `--no-default-features`
# for targets ONNX Runtime ships no prebuilt libraries for (macOS x86_64) — the
# app works normally, AI search reports "not included in this build".
ai-search = ["dcs-app/ai-search"]

[dependencies]
dcs-app.workspace = true
dcs-domain.workspace = true

egui.workspace = true
eframe.workspace = true
rfd.workspace = true

# Windows-only: embed the app icon into the .exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
