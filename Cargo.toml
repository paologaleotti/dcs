[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paologaleotti/dcs"

# All external deps live here. Each crate pulls only what it needs via
# `<dep>.workspace = true`. Single source of truth for versions.
[workspace.dependencies]
dcs-domain = { path = "crates/dcs-domain" }
# default-features off so each consumer forwards `ai-search` explicitly; the
# binary crate's default turns it on, and `--no-default-features` builds a
# search-less binary for targets ONNX Runtime has no prebuilt libraries for.
dcs-io = { path = "crates/dcs-io", default-features = false }
dcs-app = { path = "crates/dcs-app", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "macros", "parsing"] }
# `system` feature resolves the OS local zone (the shoot-zone default).
time-tz = { version = "2", features = ["system"] }
fuzzy-matcher = "0.3"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
turbojpeg = "1"
kamadak-exif = "0.6"
rayon = "1"
walkdir = "2"
blake3 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
crossbeam-channel = "0.5"
# Local CLIP-style embedding inference for AI search (dcs-io only), via ONNX
# Runtime. Pinned exactly: 2.0 release candidates break API between rcs. The
# `webgpu` EP (Dawn: Metal / DX12 / Vulkan) accelerates on every GPU vendor and
# OS with zero user-installed dependencies; absent a GPU it falls back to CPU.
# Defaults off to drop ndarray/tracing; rustls avoids the native TLS stack for
# the build-time runtime download.
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "std",
    "download-binaries",
    "tls-rustls",
    "copy-dylibs",
    "api-24",
    "webgpu",
] }
# SigLIP uses a SentencePiece tokenizer (not CLIP BPE); load tokenizer.json with
# the HF tokenizers crate. default-features off avoids the http/onig pulls.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# Build-time only (dcs-io build.rs): fetch (rustls TLS, no OpenSSL C dep) and
# verify the model files baked into the binary.
ureq = "2"
sha2 = "0.10"
# Build-time only (dcs-ui build.rs, Windows): embed assets/icon.ico into the .exe
# so Explorer, the taskbar, and the installer shortcut show the app icon.
winresource = "0.1"
rfd = "0.15"
# PDF generation for the contact-sheet renderer (dcs-io only). Pure Rust, no C
# deps; ships the standard-14 PDF fonts (Helvetica) so no font file is bundled.
# default-features off drops the `html` layout engine (kuchiki/fontconfig/azul)
# we don't use. `images` enables image XObjects; `jpeg` lets embedded thumbnails
# use DCTDecode (JPEG) so a whole-roll sheet is a few MB, not hundreds.
printpdf = { version = "0.9", default-features = false, features = [
    "images",
    "jpeg",
] }
egui = "0.34.3"
# wgpu backend → Metal on macOS, Vulkan/DX12 elsewhere. Unlike the glow
# (OpenGL) backend, Metal drives ProMotion (120 Hz); Apple caps GL surfaces
# at 60. The grid's scroll smoothness rides on this.
eframe = { version = "0.34.3", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
